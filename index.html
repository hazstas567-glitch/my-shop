<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้าของฉัน</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 20px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }

    .product {
      background: #202020;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 15px;
    }

    .product h2 {
      margin-top: 0;
    }

    .price {
      font-size: 22px;
      color: #00ff88;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #00c853;
      color: white;
      font-size: 17px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  🛒 ร้านค้าของฉัน
</header>

<div class="container">

  <div class="product">
    <h2>🎮 รหัสเกม 1</h2>
    <p>รหัสเกมพร้อมใช้งาน</p>
    <div class="price">฿50</div>
    <button>ซื้อสินค้า</button>
  </div>

  <div class="product">
    <h2>🎁 สุ่มรหัส</h2>
    <p>สุ่มรางวัลจากรายการที่กำหนด</p>
    <div class="price">฿20</div>
    <button>สุ่มเลย</button>
  </div>

</div>

</body>
</html>
